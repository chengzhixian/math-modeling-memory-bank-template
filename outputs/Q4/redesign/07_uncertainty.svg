  <g id="text_29">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #243746" x="12.96" y="17.973688" transform="rotate(-0 12.96 17.973688)">07  预测的不确定性从固定假设扩展到情景与偏差</text>
  </g>
  <g id="text_30">
   <text style="font-size: 8.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #718096" x="12.96" y="33.877025" transform="rotate(-0 12.96 33.877025)">后训练 · 主资源筛选 · 算力增长减半；三层范围定义不同，分别展示</text>
  </g>
  <g id="text_31">
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 376.838503)">12月固定范围 50.30–56.01；情景并集 37.75–72.24；偏差压力 31.59–78.40。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 390.005032)">黑点为分位资源点预测；并集还纳入候选模型与资源参数变化。偏差压力沿用历史最大绝对误差。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 403.207888)">三层均无未来覆盖率保证，不称作 95% 预测区间；偏差的长时距保持是假设。</text>
  </g>
 </g>
