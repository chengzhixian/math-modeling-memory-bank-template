  <g id="text_23">
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 376.802175)">后训练三个分箱的规模项份额：−16.47%、−13.15%、−50.08%；主规格为 0.5 decade。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 389.882571)">主规格保留：后训练 313 / 423，基座 78 / 41（早 / 晚）；控制开发者后仅 6 / 8、3 / 2。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 403.189724)">这些规格诊断不能证明 D 与资源结构稳定，也不能把时间项转为因果技术贡献。</text>
