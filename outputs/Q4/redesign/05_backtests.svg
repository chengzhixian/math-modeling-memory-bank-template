   <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #243746" x="12.96" y="18.01525" transform="rotate(-0 12.96 18.01525)">05  四个滚动窗口中，候选模型表现因类型而异</text>
  </g>
  <g id="text_29">
   <text style="font-size: 8.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #718096" x="12.96" y="33.902259" transform="rotate(-0 12.96 33.902259)">主资源筛选；每个点是一个两个月测试窗口的预测误差，不合并成误差棒</text>
  </g>
  <g id="text_30">
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 376.809207)">后训练分位资源 RMSE 2.199 略优于均值资源 2.237；基座常数模型 RMSE 7.633 最低。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 390.016165)">全部候选测试 R² 为负；只有四个重叠窗口，模型选择与比较共用这些诊断，不构成独立盲测。</text>
   <text style="font-size: 7.5px; font-family: 'Microsoft YaHei'; fill: #718096" transform="translate(12.96 403.207888)">点按起点先后轻微横向错开；不能将四个窗口当作独立重复实验。</text>
  </g>
 </g>
